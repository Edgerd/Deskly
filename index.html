<body class="cursor-default">

    <!-- Menus -->
    <div class="menu" menu="logo" nomatchapp="yes">
        <p onclick="moduleItems.clickMenuItem(this)" cmd="moduleItems.create('./assets/apps/关于本机.html')" target="关于本机" data-i18n="menu.about" data-i18n-fallback="关于本机">
            关于本机</p>
        <hr />
        <p onclick="moduleItems.clickMenuItem(this)" cmd="moduleItems.create('./assets/apps/系统设置.html')" target="系统设置" data-i18n="menu.systemPreferences" data-i18n-fallback="系统设置...">
            系统设置...</p>
        <p onclick="moduleItems.clickMenuItem(this)" cmd="moduleItems.create('App Store', 'App Store')" target="App Store" data-i18n="menu.appStore" data-i18n-fallback="App Store...">
            App Store...</p>
        <hr />
        <p onclick="moduleItems.clickMenuItem(this)" data-i18n="menu.recentItems" data-i18n-fallback="最近使用的项目">最近使用的项目</p>

        <hr />
        <p onclick="moduleItems.clickMenuItem(this)" data-i18n="menu.sleep" data-i18n-fallback="睡眠">睡眠</p>
        <p onclick="moduleItems.clickMenuItem(this)" data-i18n="menu.restart" data-i18n-fallback="重新启动...">重新启动...</p>
        <p onclick="moduleItems.clickMenuItem(this)" data-i18n="menu.shutdown" data-i18n-fallback="关机...">关机...</p>

        <p onclick="moduleItems.clickMenuItem(this)" data-i18n="menu.logOut" data-i18n-fallback="退出登录 “Edgerd”...">退出登录 “Edgerd”...</p>
    </div>
    <div class="menu" menu="appname" nomatchapp="yes">
        <p onclick="moduleItems.clickMenuItem(this)" data-i18n="menu.app.about" data-i18n-fallback="关于访达">关于访达</p>
        <hr />
        <p onclick="moduleItems.clickMenuItem(this)" data-i18n="menu.app.settings" data-i18n-fallback="设置...">设置...</p>

        <p onclick="moduleItems.clickMenuItem(this)" data-i18n="menu.app.emptyTrash" data-i18n-fallback="清倒废纸篓">清倒废纸篓</p>
        <hr />
        <p onclick="moduleItems.clickMenuItem(this)" data-i18n="menu.app.services" data-i18n-fallback="服务">服务</p>

        <p onclick="moduleItems.clickMenuItem(this)" data-i18n="menu.app.hide" data-i18n-fallback="隐藏访达">隐藏访达</p>
        <p onclick="moduleItems.clickMenuItem(this)" data-i18n="menu.app.hideOthers" data-i18n-fallback="隐藏其他">隐藏其他</p>
        <p disabled onclick="moduleItems.clickMenuItem(this)" data-i18n="menu.app.showAll" data-i18n-fallback="全部显示">全部显示</p>
