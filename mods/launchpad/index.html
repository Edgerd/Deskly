<div class="launchpad">
    <div class="grid-scroll">
        <div class="grid"></div>
        <div class="empty-tip" hidden>无结果</div>
    </div>
    <!-- 页码点：与原版一致，显示总页数与当前页；随文件夹展开淡出。 -->
    <div class="page-dots" hidden aria-hidden="true"></div>
    <div class="searchbar">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.8)" stroke-width="2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
        </svg>
        <input type="text" class="search-input" placeholder="搜索" />
    </div>
    <div class="folder-layer">
        <div class="folder-panel">
            <input type="text" class="folder-title" value="新建文件夹" />
            <div class="folder-grid"></div>
        </div>
    </div>
    <div class="ctx-menu" hidden></div>
</div>
