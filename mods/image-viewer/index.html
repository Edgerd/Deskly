<div class="image-viewer window">
    <div class="wintools">
        <div class="red"></div>
        <div class="yellow"></div>
        <div class="green"></div>
    </div>
    <div class="toolbar">
        <button class="btn-open" title="打开图片">打开</button>
        <div class="separator"></div>
        <button class="btn-zoom-in" title="放大">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </button>
        <button class="btn-zoom-out" title="缩小">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                <path d="M3 8h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </button>
        <span class="zoom-level">100%</span>
        <div class="separator"></div>
        <button class="btn-rotate-left" title="向左旋转">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                <path d="M4 8a4 4 0 1 1 4 4M4 8V4M4 8h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
        </button>
        <button class="btn-rotate-right" title="向右旋转">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                <path d="M12 8a4 4 0 1 0-4 4M12 8V4M12 8H8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            </svg>
        </button>
        <div class="separator"></div>
        <button class="btn-slideshow" title="幻灯片播放">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                <path d="M5 3l8 5-8 5V3z"/>
            </svg>
        </button>
        <button class="btn-fullscreen" title="全屏">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                <path d="M2 2h5v2H4v3H2V2zM14 2H9v2h3v3h2V2zM2 14h5v-2H4v-3H2v5zM14 14H9v-2h3v-3h2v5z"/>
            </svg>
        </button>
    </div>
    <div class="viewer-container">
        <div class="image-wrapper">
            <img class="display-image" src="" alt="图片预览" style="display: none;">
            <div class="placeholder">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <path d="M21 15l-5-5L5 21"/>
                </svg>
                <p>点击"打开"按钮选择图片</p>
            </div>
        </div>
    </div>
    <div class="thumbnail-bar" style="display: none;">
        <div class="thumbnails"></div>
    </div>
    <div class="statusbar">
        <span class="file-name">未加载</span>
        <span class="image-info">-</span>
    </div>
</div>
