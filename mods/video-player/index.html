<div class="video-player window">
    <div class="wintools">
        <div class="red"></div>
        <div class="yellow"></div>
        <div class="green"></div>
    </div>
    <div class="video-container">
        <video class="video-element" preload="metadata">
            <source src="" type="video/mp4">
            <source src="" type="video/webm">
            您的浏览器不支持视频播放
        </video>
        <div class="video-placeholder">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="2" y="4" width="20" height="16" rx="2"/>
                <path d="M10 9l5 3-5 3V9z" fill="currentColor"/>
            </svg>
            <p>点击"打开"按钮选择视频</p>
        </div>
    </div>
    <div class="controls">
        <div class="progress-container">
            <div class="progress-bar">
                <div class="progress-played"></div>
                <div class="progress-buffer"></div>
            </div>
            <span class="time-current">0:00</span>
            <span class="time-duration">0:00</span>
        </div>
        <div class="controls-bar">
            <div class="controls-left">
                <button class="btn-play" title="播放/暂停">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor">
                        <path d="M5 3l10 6-10 6V3z"/>
                    </svg>
                </button>
                <button class="btn-stop" title="停止">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <rect x="3" y="3" width="10" height="10"/>
                    </svg>
                </button>
                <button class="btn-fullscreen" title="全屏">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M2 2h5v2H4v3H2V2zM14 2H9v2h3v3h2V2zM2 14h5v-2H4v-3H2v5zM14 14H9v-2h3v-3h2v5z"/>
                    </svg>
                </button>
            </div>
            <div class="controls-center">
                <button class="btn-rewind" title="后退10秒">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M6 3l-5 5 5 5V3zM13 3l-5 5 5 5V3z"/>
                    </svg>
                </button>
                <button class="btn-forward" title="前进10秒">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M3 3l5 5-5 5V3zM10 3l5 5-5 5V3z"/>
                    </svg>
                </button>
            </div>
            <div class="controls-right">
                <button class="btn-mute" title="静音">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                        <path d="M2 5h2l4-4v14l-4-4H2V5z"/>
                        <path d="M12 4c1.5 1.5 1.5 6.5 0 8" stroke="currentColor" stroke-width="1.5" fill="none"/>
                    </svg>
                </button>
                <div class="volume-container">
                    <input type="range" class="volume-slider" min="0" max="100" value="100">
                </div>
                <button class="btn-open" title="打开视频">打开</button>
            </div>
        </div>
    </div>
</div>
