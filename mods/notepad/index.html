<div class="notepad window" data-view="wysiwyg" data-format="md">
    <div class="wintools">
        <div class="red"></div>
        <div class="yellow"></div>
        <div class="green"></div>
    </div>

    <!-- 第一行：文件操作工具栏 -->
    <div class="toolbar toolbar-primary">
        <button class="btn-new" title="新建 (⌘N)">
            <svg viewBox="0 0 16 16" width="16" height="16"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
        <div class="heading-group">
            <button class="btn-heading" data-level="1">H1</button>
            <button class="btn-heading" data-level="2">H2</button>
            <button class="btn-heading" data-level="3">H3</button>
        </div>
        <button class="btn-save" title="保存 (⌘S)">
            <svg viewBox="0 0 16 16" width="15" height="15"><path d="M3 3h7l3 3v7H3z" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M5 3v4h5V3M5 14v-3h6v3" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        </button>
        <button class="btn-download" title="下载 (⇧⌘S)">
            <svg viewBox="0 0 16 16" width="15" height="15"><path d="M8 2v8m0 0l3-3m-3 3L5 7M3 13h10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="btn-open" title="打开 (⌘⇧O)">
            <svg viewBox="0 0 16 16" width="15" height="15"><path d="M2 4h4l2 2h6v6H2z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
        </button>
    </div>

    <!-- 第二行：视图切换 -->
    <div class="toolbar toolbar-view">
        <div class="view-switch">
            <button class="btn-view active" data-view="wysiwyg" title="所见即所得">
                <svg viewBox="0 0 16 16" width="14" height="14"><path d="M1 8s2.5-4.5 7-4.5S15 8 15 8s-2.5 4.5-7 4.5S1 8 1 8z" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="8" cy="8" r="2" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
                <span>所见即所得</span>
            </button>
            <button class="btn-view" data-view="split" title="分屏">
                <svg viewBox="0 0 16 16" width="14" height="14"><rect x="1.5" y="3" width="5" height="10" rx="1" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="9.5" y="3" width="5" height="10" rx="1" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
                <span>分屏</span>
            </button>
            <button class="btn-view" data-view="source" title="源码">
                <svg viewBox="0 0 16 16" width="14" height="14"><path d="M5.5 4.5L2.5 8l3 3.5M10.5 4.5L13.5 8l-3 3.5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span>源码</span>
            </button>
        </div>
        <div class="file-name" title="未命名">未命名</div>
    </div>

    <!-- 第三行：格式化工具栏（仅 MD 模式显示） -->
    <div class="toolbar toolbar-format">
        <div class="fmt-group">
            <button class="btn-heading" data-level="1">H1</button>
            <button class="btn-heading" data-level="2">H2</button>
            <button class="btn-heading" data-level="3">H3</button>
        </div>
        <span class="fmt-divider"></span>
        <div class="fmt-group">
            <button class="btn-bold" title="粗体 (⌘B)"><b>B</b></button>
            <button class="btn-italic" title="斜体 (⌘I)"><i>I</i></button>
            <button class="btn-strike" title="删除线"><s>S</s></button>
        </div>
        <span class="fmt-divider"></span>
        <div class="fmt-group">
            <button class="btn-code" title="代码块">&lt;/&gt;</button>
            <button class="btn-quote" title="引用">❝</button>
        </div>
        <span class="fmt-divider"></span>
        <div class="fmt-group">
            <button class="btn-ul" title="无序列表">•≡</button>
            <button class="btn-ol" title="有序列表">1≡</button>
            <button class="btn-link" title="链接">🔗</button>
            <button class="btn-image" title="图片">🖼</button>
        </div>
        <span class="fmt-divider"></span>
        <div class="fmt-group">
            <button class="btn-hr" title="分割线">—</button>
            <button class="btn-table" title="表格">▦</button>
        </div>
    </div>

    <!-- 主体：侧边栏 + 编辑区 -->
    <div class="body">
        <aside class="sidebar">
            <div class="sidebar-title">已保存的笔记</div>
            <div class="note-list"></div>
            <div class="note-empty">暂无保存的笔记</div>
        </aside>

        <div class="editor-area">
            <!-- 所见即所得 -->
            <div class="editor-wysiwyg" contenteditable="true" data-placeholder="开始输入 Markdown，所见即所得..."></div>

            <!-- 源码模式 -->
            <div class="editor-source-wrap">
                <div class="line-numbers"></div>
                <textarea class="editor-source" spellcheck="false" placeholder="开始输入 Markdown 源码..."></textarea>
            </div>

            <!-- 分屏模式 -->
            <div class="editor-split">
                <div class="split-pane split-source-pane">
                    <div class="line-numbers"></div>
                    <textarea class="editor-source-split" spellcheck="false"></textarea>
                </div>
                <div class="split-divider"></div>
                <div class="split-pane split-preview-pane">
                    <div class="editor-wysiwyg split-preview" contenteditable="false"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 状态栏 -->
    <div class="statusbar">
        <span class="file-info">未命名.md</span>
        <span class="stats"><span class="line-count">行数 1</span> · <span class="word-count">字数 0</span></span>
        <span class="cursor-info">行 1, 列 1</span>
        <span class="encoding">UTF-8</span>
        <span class="format-badge">MD</span>
    </div>
</div>
