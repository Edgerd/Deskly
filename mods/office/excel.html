<div class="office window office-excel" data-window="size:1000x700 centered">
    <deskly-traffic-lights class="wintools" overlay></deskly-traffic-lights>

    <div class="office-titlebar" data-titlebar>
        <span class="office-doctitle">未命名表格</span>
        <span class="office-dirty" hidden data-i18n="office.dirtyMark">未保存</span>
        <div class="office-qat">
            <button type="button" data-qat="save" data-i18n-title="office.qatSave" data-i18n-aria="office.qatSave" title="保存 (⌘S)" aria-label="保存">⤓</button>
            <button type="button" data-qat="undo" data-i18n-title="office.qatUndo" data-i18n-aria="office.qatUndo" title="撤销 (⌘Z)" aria-label="撤销">↶</button>
            <button type="button" data-qat="redo" data-i18n-title="office.qatRedo" data-i18n-aria="office.qatRedo" title="重做 (⌘⇧Z)" aria-label="重做">↷</button>
            <button type="button" data-qat="print" data-i18n-title="office.qatPrint" data-i18n-aria="office.qatPrint" title="打印 / 导出 PDF (⌘P)" aria-label="打印">⎙</button>
        </div>
        <span class="office-filename" data-role="filename" hidden></span>
    </div>

    <div class="office-ribbon" data-role="ribbon"></div>

    <div class="office-canvas">
        <div class="office-view" data-role="view"></div>
    </div>

    <div class="office-statusbar">
        <span class="office-metric" data-role="metric">0 行 × 0 列</span>
        <span class="office-note" data-role="note"></span>
    </div>
</div>
