<!-- 窗口尺寸与可缩放性在本文件 data-window 声明（window-manager.readDeclaration），改尺寸只动这里 -->
<div class="about_this_mac window" data-window="size:280x515 resizable:false centered">
    <deskly-traffic-lights class="wintools" variant="dialog"></deskly-traffic-lights>
    <img src="../../assets/devices/mac16,11.png" />
    <p class="model">iMac</p>
    <p class="year">24 英寸，2024</p>
    <div class="content">
        <div class="left">
            <p data-i18n="about.processor" data-i18n-fallback="处理器">处理器</p>
            <p data-i18n="about.memory" data-i18n-fallback="内存">内存</p>
            <p data-i18n="about.serial" data-i18n-fallback="序列号">序列号</p>
            <p data-i18n="about.systemVersion" data-i18n-fallback="系统版本">系统版本</p>
        </div>
        <div class="right">
            <p>Apple M4</p>
            <p>16 GB</p>
            <p class="serial">DESKLY2026001</p>
            <p class="os-version">Deskly 0.2.78</p>
        </div>
    </div>
    <div class="button" data-i18n="about.moreInfo" data-i18n-fallback="更多信息...">更多信息...</div>
    <div class="sys-report" hidden>
        <div class="sys-report__head">
            <p class="sys-report__title" data-i18n="about.report.title" data-i18n-fallback="系统报告">系统报告</p>
            <button type="button" class="sys-report__close" data-i18n="about.report.close" data-i18n-fallback="完成">完成</button>
        </div>
        <div class="sys-report__body"></div>
    </div>
    <img class="brand-logo" src="../../assets/brand/deskly-logo-192.png" alt="Deskly" width="32" height="32" />
    <p class="copyright"><span data-i18n="about.compliance" data-i18n-fallback="监管认证">监管认证</span><br />
        &trade; 和 &copy; 2026 Edgerd &middot; Deskly<br />
        <span data-i18n="about.attribution" data-i18n-fallback="参考设计来源于 Apple macOS UI 设计。">参考设计来源于 Apple macOS UI 设计。</span>
    </p>
</div>
