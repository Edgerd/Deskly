<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设置项排版编辑器 · MD3E</title>
<style>
/* ============ MD3 Expressive 设计令牌 ============ */
:root {
    --md-primary: #6750a4;
    --md-on-primary: #ffffff;
    --md-primary-container: #eaddff;
    --md-on-primary-container: #21005d;
    --md-secondary-container: #e8def8;
    --md-on-secondary-container: #1d192b;
    --md-tertiary-container: #ffd8e4;
    --md-surface: #fdf8fd;
    --md-surface-dim: #ded8e1;
    --md-surface-container-lowest: #ffffff;
    --md-surface-container-low: #f7f2fa;
    --md-surface-container: #f3edf7;
    --md-surface-container-high: #ece6f0;
    --md-surface-container-highest: #e6e0e9;
    --md-on-surface: #1d1b20;
    --md-on-surface-variant: #49454f;
    --md-outline: #79747e;
    --md-outline-variant: #cac4d0;
    --md-error: #b3261e;
    --md-error-container: #f9dedc;
    --md-on-error-container: #410e0b;
    --md-success: #146c2e;
    --md-success-container: #c4eed0;
    --ease-spring: cubic-bezier(.2, 0, 0, 1);
    --ease-emphasized: cubic-bezier(.05, .7, .1, 1);
    --radius-xs: 8px;
    --radius-sm: 12px;
    --radius-md: 16px;
    --radius-lg: 24px;
    --radius-xl: 28px;
    --radius-full: 999px;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, .08), 0 1px 3px 1px rgba(0, 0, 0, .04);
    --shadow-2: 0 2px 6px 2px rgba(0, 0, 0, .08), 0 1px 2px rgba(0, 0, 0, .12);
    --shadow-3: 0 8px 24px 4px rgba(0, 0, 0, .12), 0 2px 6px rgba(0, 0, 0, .08);
    --font: "SF Pro Text", "Segoe UI Variable", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}

/* 深色令牌：跟随系统，也可手动切 */
html[data-theme="dark"] {
    --md-primary: #d0bcff;
    --md-on-primary: #381e72;
    --md-primary-container: #4f378b;
    --md-on-primary-container: #eaddff;
    --md-secondary-container: #4a4458;
    --md-on-secondary-container: #e8def8;
    --md-tertiary-container: #633b48;
    --md-surface: #141218;
    --md-surface-dim: #141218;
    --md-surface-container-lowest: #0f0d13;
    --md-surface-container-low: #1d1b20;
    --md-surface-container: #211f26;
    --md-surface-container-high: #2b2930;
    --md-surface-container-highest: #36343b;
    --md-on-surface: #e6e0e9;
    --md-on-surface-variant: #cac4d0;
    --md-outline: #938f99;
    --md-outline-variant: #49454f;
    --md-error: #f2b8b5;
    --md-error-container: #8c1d18;
    --md-on-error-container: #f9dedc;
    --md-success: #6dd58c;
    --md-success-container: #0a3818;
    --shadow-1: 0 1px 2px rgba(0, 0, 0, .4);
    --shadow-2: 0 2px 8px 2px rgba(0, 0, 0, .45);
    --shadow-3: 0 10px 28px 6px rgba(0, 0, 0, .5);
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
    margin: 0;
    font-family: var(--font);
    font-size: 14px;
    color: var(--md-on-surface);
    background: var(--md-surface);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
}

button, input, textarea, select { font: inherit; color: inherit; }

/* ============ 顶栏 ============ */
.appbar {
    display: flex;
    align-items: center;
    gap: 12px;
    height: 64px;
    padding: 0 16px 0 20px;
    background: var(--md-surface-container);
    border-bottom: 1px solid var(--md-outline-variant);
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    flex: 1 1 auto;
}

.brand__mark {
    display: grid;
    place-items: center;
    width: 40px;
    height: 40px;
    flex: 0 0 auto;
    border-radius: var(--radius-sm);
    background: var(--md-primary-container);
    color: var(--md-on-primary-container);
}

.brand__mark svg { width: 22px; height: 22px; }

.brand__text { min-width: 0; }

.brand__title {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: .2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.brand__sub {
    margin: 2px 0 0;
    font-size: 11.5px;
    color: var(--md-on-surface-variant);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.appbar__actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

/* ============ 按钮 ============ */
.btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 40px;
    padding: 0 18px;
    border: 1px solid transparent;
    border-radius: var(--radius-full);
    background: transparent;
    color: var(--md-primary);
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
    transition: background .18s var(--ease-spring), box-shadow .18s var(--ease-spring), transform .12s var(--ease-spring);
}

.btn svg { width: 18px; height: 18px; flex: 0 0 auto; }

.btn:hover { background: color-mix(in srgb, var(--md-primary) 8%, transparent); }
.btn:active { transform: scale(.97); }
.btn:focus-visible { outline: 2px solid var(--md-primary); outline-offset: 2px; }

.btn--filled { background: var(--md-primary); color: var(--md-on-primary); }
.btn--filled:hover { background: color-mix(in srgb, var(--md-primary) 88%, #000); box-shadow: var(--shadow-1); }

.btn--tonal { background: var(--md-secondary-container); color: var(--md-on-secondary-container); }
.btn--tonal:hover { background: color-mix(in srgb, var(--md-secondary-container) 82%, var(--md-primary)); }

.btn--outlined { border-color: var(--md-outline-variant); color: var(--md-on-surface-variant); }
.btn--outlined:hover { background: color-mix(in srgb, var(--md-on-surface) 6%, transparent); }

.btn--danger { color: var(--md-error); }
.btn--danger:hover { background: color-mix(in srgb, var(--md-error) 10%, transparent); }

.btn--icon {
    width: 40px;
    padding: 0;
    justify-content: center;
    color: var(--md-on-surface-variant);
}

.btn--icon:hover { background: color-mix(in srgb, var(--md-on-surface) 8%, transparent); }

.btn[disabled] { opacity: .38; cursor: not-allowed; pointer-events: none; }

/* ============ 主体三栏 ============ */
.workspace {
    display: grid;
    grid-template-columns: 260px minmax(0, 1fr) 340px;
    height: calc(100vh - 64px);
    min-height: 0;
}

/* ============ 左栏：面板列表 ============ */
.sidebar {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--md-surface-container-low);
    border-right: 1px solid var(--md-outline-variant);
}

.sidebar__head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 16px 8px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .8px;
    color: var(--md-on-surface-variant);
}

.sidebar__list { flex: 1 1 auto; overflow: auto; padding: 0 10px 12px; }

.pane-item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 2px;
    border: 0;
    border-radius: var(--radius-full);
    background: transparent;
    text-align: left;
    cursor: pointer;
    transition: background .16s var(--ease-spring);
}

.pane-item:hover { background: color-mix(in srgb, var(--md-on-surface) 6%, transparent); }

.pane-item[aria-selected="true"] {
    background: var(--md-secondary-container);
    color: var(--md-on-secondary-container);
}

.pane-item__icon {
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    flex: 0 0 auto;
    border-radius: 9px;
    background: var(--md-primary-container);
    color: var(--md-on-primary-container);
}

.pane-item__icon svg { width: 17px; height: 17px; }

.pane-item__name {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    font-size: 13.5px;
}

.pane-item__count {
    flex: 0 0 auto;
    font-size: 11px;
    padding: 2px 8px;
    border-radius: var(--radius-full);
    background: color-mix(in srgb, var(--md-on-surface) 8%, transparent);
    color: var(--md-on-surface-variant);
}

.sidebar__foot { padding: 12px; border-top: 1px solid var(--md-outline-variant); }

/* ============ 中栏：画布 ============ */
.canvas {
    min-width: 0;
    min-height: 0;
    overflow: auto;
    padding: 24px clamp(16px, 4vw, 40px) 80px;
    background:
        radial-gradient(circle at 12% 0%, color-mix(in srgb, var(--md-primary) 10%, transparent), transparent 42%),
        radial-gradient(circle at 92% 8%, color-mix(in srgb, var(--md-tertiary-container) 60%, transparent), transparent 40%),
        var(--md-surface);
}

.canvas__head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    margin: 0 auto 18px;
    max-width: 760px;
}

.canvas__title {
    margin: 0;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -.2px;
    line-height: 1.2;
}

.canvas__sub {
    margin: 6px 0 0;
    font-size: 12.5px;
    color: var(--md-on-surface-variant);
}

.canvas__tools { display: flex; gap: 8px; flex: 0 0 auto; }

/* 分组卡片 */
.group {
    max-width: 760px;
    margin: 0 auto 22px;
    padding: 8px;
    border-radius: var(--radius-xl);
    background: var(--md-surface-container-low);
    box-shadow: var(--shadow-1);
    border: 1px solid color-mix(in srgb, var(--md-outline-variant) 55%, transparent);
}

.group__title {
    padding: 10px 14px 6px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .4px;
    color: var(--md-on-surface-variant);
    text-transform: none;
}

.group__rows { display: flex; flex-direction: column; gap: 2px; }

/* 设置项卡片 */
.item {
    position: relative;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 12px 12px 8px;
    border-radius: var(--radius-lg);
    background: transparent;
    cursor: pointer;
    transition: background .16s var(--ease-spring), transform .16s var(--ease-spring), box-shadow .2s var(--ease-spring);
}

.item:hover { background: var(--md-surface-container-high); }

.item[aria-selected="true"] {
    background: var(--md-secondary-container);
    box-shadow: var(--shadow-1);
}

.item.dragging { opacity: .45; transform: scale(.98); }

.item.drop-before::before,
.item.drop-after::after {
    content: "";
    position: absolute;
    left: 10px;
    right: 10px;
    height: 3px;
    border-radius: 2px;
    background: var(--md-primary);
}

.item.drop-before::before { top: -2px; }
.item.drop-after::after { bottom: -2px; }

.item__handle {
    display: grid;
    place-items: center;
    width: 28px;
    height: 30px;
    flex: 0 0 auto;
    border-radius: var(--radius-sm);
    color: var(--md-outline);
    cursor: grab;
    opacity: .55;
    transition: opacity .16s ease, background .16s ease;
}

.item:hover .item__handle { opacity: 1; background: color-mix(in srgb, var(--md-on-surface) 6%, transparent); }
.item__handle:active { cursor: grabbing; }
.item__handle svg { width: 16px; height: 16px; }

.item__icon {
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    flex: 0 0 auto;
    border-radius: 10px;
    background: var(--md-primary-container);
    color: var(--md-on-primary-container);
}

.item__icon svg { width: 18px; height: 18px; }

.item__main { flex: 1 1 auto; min-width: 0; }

.item__title {
    font-size: 14px;
    line-height: 1.35;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.item__desc {
    margin-top: 2px;
    font-size: 11.5px;
    line-height: 1.4;
    color: var(--md-on-surface-variant);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.item__desc.is-empty { opacity: .45; font-style: italic; }

.item__control { flex: 0 0 auto; color: var(--md-outline); display: flex; align-items: center; gap: 10px; }
.item__control svg { width: 18px; height: 18px; }

/* 开关预览 */
.preview-switch {
    width: 40px;
    height: 24px;
    border-radius: var(--radius-full);
    background: var(--md-surface-container-highest);
    border: 2px solid var(--md-outline);
    position: relative;
    flex: 0 0 auto;
}

.preview-switch::after {
    content: "";
    position: absolute;
    top: 50%;
    left: 4px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--md-outline);
    transform: translateY(-50%);
}

.preview-switch.is-on { background: var(--md-primary); border-color: var(--md-primary); }
.preview-switch.is-on::after { left: calc(100% - 16px); background: var(--md-on-primary); }

.preview-slider { width: 84px; height: 4px; border-radius: 2px; background: var(--md-outline-variant); position: relative; }
.preview-slider::after {
    content: "";
    position: absolute;
    top: 50%; left: 45%;
    width: 12px; height: 12px;
    border-radius: 50%;
    background: var(--md-primary);
    transform: translate(-50%, -50%);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--md-primary) 14%, transparent);
}

.preview-chip {
    padding: 3px 10px;
    border-radius: var(--radius-full);
    border: 1px solid var(--md-outline-variant);
    font-size: 11.5px;
    color: var(--md-on-surface-variant);
}

/* 追加行 */
.add-row {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 12px 14px;
    margin-top: 2px;
    border: 0;
    border-radius: var(--radius-lg);
    background: transparent;
    color: var(--md-primary);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background .16s var(--ease-spring);
}

.add-row:hover { background: color-mix(in srgb, var(--md-primary) 8%, transparent); }
.add-row svg { width: 18px; height: 18px; }

.empty-hint {
    max-width: 760px;
    margin: 40px auto;
    padding: 28px;
    border-radius: var(--radius-xl);
    border: 1.5px dashed var(--md-outline-variant);
    text-align: center;
    color: var(--md-on-surface-variant);
    font-size: 13px;
    line-height: 1.7;
}

/* ============ 右栏：属性面板 ============ */
.inspector {
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--md-surface-container-low);
    border-left: 1px solid var(--md-outline-variant);
}

.inspector__head {
    padding: 18px 18px 12px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .6px;
    color: var(--md-on-surface-variant);
}

.inspector__body { flex: 1 1 auto; overflow: auto; padding: 0 18px 24px; }

.field { margin-bottom: 16px; }

.field__label {
    display: block;
    margin-bottom: 6px;
    font-size: 11.5px;
    font-weight: 500;
    color: var(--md-on-surface-variant);
}

.field__hint { margin: 6px 0 0; font-size: 11px; line-height: 1.5; color: var(--md-on-surface-variant); opacity: .85; }

.input, .textarea, .select {
    width: 100%;
    padding: 11px 14px;
    border-radius: var(--radius-md);
    border: 1px solid var(--md-outline-variant);
    background: var(--md-surface-container-lowest);
    color: var(--md-on-surface);
    font-size: 13.5px;
    outline: none;
    transition: border-color .16s ease, box-shadow .16s ease, background .16s ease;
}

.input:focus, .textarea:focus, .select:focus {
    border-color: var(--md-primary);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--md-primary) 18%, transparent);
}

.textarea { resize: vertical; min-height: 78px; line-height: 1.55; }

.select { appearance: none; cursor: pointer; }

.field__row { display: flex; gap: 8px; }
.field__row > * { flex: 1 1 0; min-width: 0; }

.segmented {
    display: flex;
    gap: 4px;
    padding: 4px;
    border-radius: var(--radius-full);
    background: var(--md-surface-container-high);
}

.segmented button {
    flex: 1 1 0;
    height: 32px;
    border: 0;
    border-radius: var(--radius-full);
    background: transparent;
    color: var(--md-on-surface-variant);
    font-size: 12px;
    cursor: pointer;
    transition: background .16s var(--ease-spring), color .16s ease;
}

.segmented button[aria-pressed="true"] {
    background: var(--md-primary);
    color: var(--md-on-primary);
}

.inspector__actions { display: flex; gap: 8px; flex-wrap: wrap; padding-top: 6px; }

.inspector__empty {
    padding: 18px;
    border-radius: var(--radius-lg);
    background: var(--md-surface-container);
    color: var(--md-on-surface-variant);
    font-size: 12.5px;
    line-height: 1.7;
}

.meta {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--md-outline-variant);
    font-size: 11px;
    color: var(--md-on-surface-variant);
    line-height: 1.6;
    word-break: break-all;
}

/* ============ Toast ============ */
.toast-host {
    position: fixed;
    left: 50%;
    bottom: 28px;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 50;
    pointer-events: none;
    width: min(92vw, 520px);
}

.toast {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 18px;
    border-radius: var(--radius-full);
    background: var(--md-surface-container-highest);
    color: var(--md-on-surface);
    box-shadow: var(--shadow-3);
    font-size: 13px;
    pointer-events: auto;
    animation: toast-in .28s var(--ease-emphasized);
}

.toast svg { width: 18px; height: 18px; flex: 0 0 auto; color: var(--md-primary); }
.toast__text { flex: 1 1 auto; min-width: 0; }

.toast__action {
    border: 0;
    background: transparent;
    color: var(--md-primary);
    font-weight: 600;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: var(--radius-xs);
}

@keyframes toast-in {
    from { opacity: 0; transform: translateY(14px) scale(.96); }
    to { opacity: 1; transform: none; }
}

/* ============ 对话框 ============ */
dialog {
    width: min(720px, 92vw);
    padding: 0;
    border: 0;
    border-radius: var(--radius-xl);
    background: var(--md-surface-container-high);
    color: var(--md-on-surface);
    box-shadow: var(--shadow-3);
}

dialog::backdrop { background: rgba(0, 0, 0, .42); }

.dialog__head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 22px 24px 12px;
}

.dialog__title { margin: 0; font-size: 19px; font-weight: 600; }
.dialog__body { padding: 4px 24px 12px; }
.dialog__foot { display: flex; justify-content: flex-end; gap: 8px; padding: 8px 24px 22px; flex-wrap: wrap; }

.dialog textarea {
    width: 100%;
    min-height: 280px;
    padding: 14px;
    border-radius: var(--radius-md);
    border: 1px solid var(--md-outline-variant);
    background: var(--md-surface-container-lowest);
    color: var(--md-on-surface);
    font-family: "SF Mono", "Cascadia Code", Consolas, monospace;
    font-size: 12.5px;
    line-height: 1.6;
    resize: vertical;
    outline: none;
}

.dialog textarea:focus { border-color: var(--md-primary); }

/* ============ 窄屏：不设限制，只重排 ============ */
@media (max-width: 1120px) {
    .workspace { grid-template-columns: 220px minmax(0, 1fr); }
    .inspector {
        position: fixed;
        right: 0;
        bottom: 0;
        left: 0;
        top: auto;
        max-height: 62vh;
        border-left: 0;
        border-top: 1px solid var(--md-outline-variant);
        border-radius: var(--radius-xl) var(--radius-xl) 0 0;
        box-shadow: var(--shadow-3);
        z-index: 20;
        transform: translateY(calc(100% - 0px));
        transition: transform .3s var(--ease-emphasized);
    }
    .inspector.is-open { transform: none; }
    .canvas { padding-bottom: 200px; }
}

@media (max-width: 720px) {
    .appbar { height: auto; flex-wrap: wrap; padding: 10px 12px; }
    .workspace { grid-template-columns: minmax(0, 1fr); height: auto; }
    .sidebar {
        flex-direction: row;
        overflow-x: auto;
        border-right: 0;
        border-bottom: 1px solid var(--md-outline-variant);
    }
    .sidebar__head, .sidebar__foot { display: none; }
    .sidebar__list { display: flex; gap: 6px; padding: 10px; overflow: auto; }
    .pane-item { width: auto; margin: 0; padding: 8px 14px; }
    .pane-item__count { display: none; }
    body { overflow: auto; }
    .canvas { padding: 16px 12px 220px; }
    .inspector { max-height: 72vh; }
}
</style>
</head>
<body>

<header class="appbar">
    <div class="brand">
        <div class="brand__mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 5h16v2H4V5Zm0 6h10v2H4v-2Zm0 6h16v2H4v-2Zm14-7h2v3h3v2h-3v3h-2v-3h-3v-2h3V10Z"/></svg>
        </div>

<script>
'use strict';

/* =====================================================================
 * 1. 图标：全部内联，避免任何网络依赖
 * ===================================================================== */
const ICONS = {
    paint: '<path d="M12 3a9 9 0 1 0 0 18c1.1 0 2-.9 2-2 0-.5-.2-1-.6-1.4-.3-.3-.4-.7-.4-1.1 0-.8.7-1.5 1.5-1.5H17a4 4 0 0 0 4-4c0-4.4-4-8-9-8Zm-4.5 9a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6Zm3-4a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6Zm4.5 0a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6Zm3 4a1.3 1.3 0 1 1 0-2.6 1.3 1.3 0 0 1 0 2.6Z"/>',
    dock: '<path d="M4 5h16v10H4V5Zm2 2v6h12V7H6Zm3 9h6v1.6h3V20H6v-2.4h3V16Z"/>',
    control: '<path d="M7 4h2v10a3 3 0 1 1-2 0V4Zm8 6h2v4a3 3 0 1 1-2 0v-4Zm-4 8h2V4h-2v14Z"/>',
    hourglass: '<path d="M7 3h10v2h-1v2.1c0 2-1.6 3.6-3 4.4 1.4.8 3 2.4 3 4.4V18h1v2H7v-2h1v-2.1c0-2 1.6-3.6 3-4.4-1.4-.8-3-2.4-3-4.4V5H7V3Zm3 2v2.1c0 1.2 1.5 2.4 2 2.7.5-.3 2-1.5 2-2.7V5H10Zm0 8.1V18h4v-2.4c0-1.2-1.5-2.4-2-2.7-.5.3-2 1.5-2 2.7Z"/>',
    bell: '<path d="M12 3a6 6 0 0 0-6 6v3.6L4 16v2h16v-2l-2-3.4V9a6 6 0 0 0-6-6Zm0 2a4 4 0 0 1 4 4v4.2l1.2 2.1H6.8L8 13.2V9a4 4 0 0 1 4-4Zm-1.6 15h3.2a1.6 1.6 0 0 1-3.2 0Z"/>',
    keyboard: '<path d="M3 6h18v12H3V6Zm2 2v8h14V8H5Zm2 1.5h2v2H7v-2Zm3 0h2v2h-2v-2Zm3 0h2v2h-2v-2Zm3 0h2v2h-2v-2ZM7 13h2v2H7v-2Zm3 0h4v2h-4v-2Zm5 0h2v2h-2v-2Z"/>',
    mouse: '<path d="M12 2a6 6 0 0 1 6 6v8a6 6 0 0 1-12 0V8a6 6 0 0 1 6-6Zm0 2a4 4 0 0 0-4 4v1.5h3V4.1A4 4 0 0 0 12 4Zm1 0v5.5h3V8a4 4 0 0 0-3-3.9Z"/>',
    lock: '<path d="M12 2a5 5 0 0 1 5 5v2h1.5A1.5 1.5 0 0 1 20 10.5v9A1.5 1.5 0 0 1 18.5 21h-13A1.5 1.5 0 0 1 4 19.5v-9A1.5 1.5 0 0 1 5.5 9H7V7a5 5 0 0 1 5-5Zm0 2a3 3 0 0 0-3 3v2h6V7a3 3 0 0 0-3-3Zm0 8a2 2 0 0 0-1 3.7V18h2v-2.3A2 2 0 0 0 12 12Z"/>',
    shield: '<path d="M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5l-8-3Zm0 2.2 6 2.3v4.5c0 3.9-2.6 7.4-6 8.8-3.4-1.4-6-4.9-6-8.8V6.5l6-2.3Zm-1.2 10.9-3-3 1.4-1.4 1.6 1.6 3.6-3.6 1.4 1.4-5 5Z"/>',
    sparkles: '<path d="m12 3 1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8L12 3Zm6 10 .9 2.3 2.3.9-2.3.9-.9 2.3-.9-2.3-2.3-.9 2.3-.9.9-2.3ZM5 14l.7 1.8 1.8.7-1.8.7L5 19l-.7-1.8-1.8-.7 1.8-.7L5 14Z"/>',
    apps: '<path d="M4.5 4.5h6v6h-6v-6Zm9 0h6v6h-6v-6Zm-9 9h6v6h-6v-6Zm9 0h6v6h-6v-6Z"/>',
    info: '<path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 2a8 8 0 1 1 0 16 8 8 0 0 1 0-16Zm-1 3h2v2h-2V7Zm0 4h2v6h-2v-6Z"/>',
    drag: '<path d="M9 5h2v2H9V5Zm4 0h2v2h-2V5ZM9 11h2v2H9v-2Zm4 0h2v2h-2v-2ZM9 17h2v2H9v-2Zm4 0h2v2h-2v-2Z"/>',
    plus: '<path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6V5Z"/>',
    trash: '<path d="M9 3h6l1 2h4v2H4V5h4l1-2Zm-3 6h12l-1 12H7L6 9Zm3.2 2 .6 8h2.2l-.6-8H9.2Zm3.2 0-.6 8h2.2l.6-8h-2.2Z"/>',
    up: '<path d="m12 5 6 6-1.4 1.4L13 8.8V19h-2V8.8l-3.6 3.6L6 11l6-6Z"/>',
    down: '<path d="m12 19-6-6 1.4-1.4L11 15.2V5h2v10.2l3.6-3.6L18 13l-6 6Z"/>',
    check: '<path d="m9.2 17.6-5-5 1.4-1.4 3.6 3.6 8.2-8.2 1.4 1.4-9.6 9.6Z"/>',
    chevron: '<path d="M9.4 5 8 6.4l5.6 5.6L8 17.6 9.4 19 16.4 12 9.4 5Z"/>',
    warn: '<path d="M12 2 1.6 20h20.8L12 2Zm0 4.6L18.8 18H5.2L12 6.6ZM11 9h2v5h-2V9Zm0 6.5h2V18h-2v-2.5Z"/>',
    undo: '<path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8Z"/>',
    redo: '<path d="M12 5V2l5 4-5 4V7a6 6 0 1 0 6 6h2a8 8 0 1 1-8-8Z"/>',
};

const icon = (name, cls = '') =>
    `<svg class="${cls}" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${ICONS[name] || ICONS.info}</svg>`;

/* =====================================================================
 * 2. 示例数据：取自当前系统设置的几个面板，方便直接上手排版
 * ===================================================================== */
const SAMPLE = {
    version: 1,
    panes: [
        {
            id: 'appearance', title: '外观', icon: 'paint',
            items: [
                { id: 'appearance-colors', type: 'link', title: '颜色与主题', desc: '强调色、浅色与深色外观' },
                { id: 'appearance-surface', type: 'link', title: '侧栏与模糊', desc: '窗口材质与背景模糊强度' },
                { id: 'appearance-tint', type: 'link', title: '窗口与菜单栏', desc: '标题栏着色与菜单栏透明' },
                { id: 'appearance-desktop', type: 'link', title: '桌面与滚动', desc: '桌面图标、滚动条与动效' },
                { id: 'appearance-wallpaper', type: 'link', title: '墙纸', desc: '选择桌面图片与着色浓度' },
            ],
        },
        {
            id: 'dock', title: '桌面与程序坞', icon: 'dock',
            items: [
                { id: 'dock-main', type: 'link', title: '程序坞', desc: '自动隐藏、图标大小与放大效果' },
                { id: 'dock-desktop', type: 'link', title: '桌面', desc: '桌面图标与废纸篓图标样式' },
                { id: 'dock-stage', type: 'link', title: '台前调度', desc: '窗口分组与最近使用的应用' },
                { id: 'dock-windows', type: 'link', title: '窗口与启动台', desc: '窗口平铺与启动台图标大小' },
            ],
        },
        {
            id: 'controlcenter', title: '控制中心', icon: 'control',
            items: [
                { id: 'cc-switches', type: 'link', title: '开关', desc: '菜单栏图标、台前调度等开关' },
                { id: 'cc-menubar', type: 'link', title: '菜单栏状态项', desc: '电池、台前调度等状态项显隐' },
                { id: 'cc-live', type: 'link', title: '实时状态', desc: '当前状态摘要与不可用项说明' },
            ],
        },
        {
            id: 'screenTime', title: '屏幕使用时间', icon: 'hourglass',
            items: [
                { id: 'st-usage', type: 'link', title: '使用情况', desc: '记录开关与今日使用榜单' },
                { id: 'st-downtime', type: 'link', title: '停用时间', desc: '计划时段、重复星期与口令提醒' },
                { id: 'st-allow', type: 'link', title: '始终允许', desc: '停用期间仍可打开的应用' },
            ],
        },
        {
            id: 'notifications', title: '通知', icon: 'bell',
            items: [
                { id: 'notif-allow', type: 'switch', title: '允许通知', desc: '关闭后仅保留角标提醒' },
                { id: 'notif-style', type: 'select', title: '通知样式', desc: '横幅、提醒或仅角标' },
                { id: 'notif-preview', type: 'switch', title: '锁定屏幕显示预览', desc: '锁屏时是否展示通知内容' },
                { id: 'notif-sound', type: 'slider', title: '提示音量', desc: '通知提示音的音量大小' },
            ],
        },
    ],
};

const TYPE_LABEL = { link: '跳转行', switch: '开关', slider: '滑块', select: '选择' };
const TYPE_ICON = { link: 'chevron', switch: 'switch', slider: 'slider', select: 'chevron' };
const PANE_ICON_CHOICES = ['paint', 'dock', 'control', 'hourglass', 'bell', 'keyboard', 'mouse', 'lock', 'shield', 'sparkles', 'apps', 'info'];

/* =====================================================================
 * 3. 状态与持久化
 * ===================================================================== */
const STORAGE_KEY = 'md3e.settings-layout-editor.v1';
const THEME_KEY = 'md3e.settings-layout-editor.theme';

const clone = (value) => JSON.parse(JSON.stringify(value));

let state = loadState();
let selection = null;          // { paneId, itemId }
let undoStack = [];
let redoStack = [];
let dragContext = null;

function loadState() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return clone(SAMPLE);
        const parsed = JSON.parse(raw);
        if (!parsed || !Array.isArray(parsed.panes) || !parsed.panes.length) return clone(SAMPLE);
        return parsed;
    } catch {
        return clone(SAMPLE);
    }
}

function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch { /* 存储不可用时静默降级 */ }
}

/** 提供快照：任何改动前调用，保证 Ctrl+Z 可回退。 */
function snapshot() {
    undoStack.push(JSON.stringify(state));
    if (undoStack.length > 80) undoStack.shift();
    redoStack = [];
}

function undo() {
    if (!undoStack.length) return toast('提醒：已经是最早的状态了');
    redoStack.push(JSON.stringify(state));
    state = JSON.parse(undoStack.pop());
    normalizeSelection();
    save();
    render();
    toast('已撤销上一步');
}

function redo() {
    if (!redoStack.length) return toast('提醒：没有可以重做的步骤');
    undoStack.push(JSON.stringify(state));
    state = JSON.parse(redoStack.pop());
    normalizeSelection();
    save();
    render();
    toast('已重做');
}

/** 选中项被删掉之后，把选择收回到仍然存在的对象上。 */
function normalizeSelection() {
    if (!state.panes.length) { selection = null; return; }
    if (!selection) { selection = { paneId: state.panes[0].id, itemId: state.panes[0].items[0]?.id || null }; return; }
    const pane = state.panes.find((p) => p.id === selection.paneId) || state.panes[0];
    selection.paneId = pane.id;
    if (selection.itemId && !pane.items.some((it) => it.id === selection.itemId)) {
        selection.itemId = pane.items[0]?.id || null;
    }
}

/* =====================================================================
 * 4. 渲染
 * ===================================================================== */
const $ = (sel) => document.querySelector(sel);

function render() {
    normalizeSelection();
    renderPaneList();
    renderCanvas();
    renderInspector();
    $('#pane-total').textContent = String(state.panes.length);
}

function currentPane() {
    return state.panes.find((p) => p.id === selection?.paneId) || state.panes[0] || null;
}

function currentItem() {
    const pane = currentPane();
    return pane ? pane.items.find((it) => it.id === selection?.itemId) || null : null;
}

function renderPaneList() {
    const host = $('#pane-list');
    host.textContent = '';
    state.panes.forEach((pane) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'pane-item';
        btn.setAttribute('role', 'tab');
        btn.setAttribute('aria-selected', String(pane.id === selection?.paneId));
        btn.dataset.paneId = pane.id;
        btn.innerHTML = `
            <span class="pane-item__icon">${icon(pane.icon)}</span>
            <span class="pane-item__name"></span>
            <span class="pane-item__count">${pane.items.length}</span>`;
        btn.querySelector('.pane-item__name').textContent = pane.title;
        btn.addEventListener('click', () => {
            selection = { paneId: pane.id, itemId: pane.items[0]?.id || null };
            render();
        });
        host.append(btn);
    });
}

function renderCanvas() {
    const host = $('#canvas');
    host.textContent = '';
    const pane = currentPane();

    if (!pane) {
        host.innerHTML = `<div class="empty-hint">还没有任何面板。点击右上角「新建面板」开始。</div>`;
        return;
    }

    const head = document.createElement('div');
    head.className = 'canvas__head';
    head.innerHTML = `
        <div>
            <h2 class="canvas__title"></h2>
            <p class="canvas__sub"></p>
        </div>
        <div class="canvas__tools">
            <button class="btn btn--outlined" data-act="rename-pane" type="button">重命名</button>
            <button class="btn btn--danger" data-act="delete-pane" type="button">删除面板</button>
        </div>`;
    head.querySelector('.canvas__title').textContent = pane.title;
    head.querySelector('.canvas__sub').textContent = `${pane.items.length} 个设置项 · 拖拽左侧把手排序`;
    head.querySelector('[data-act="rename-pane"]').addEventListener('click', () => renamePane(pane));
    head.querySelector('[data-act="delete-pane"]').addEventListener('click', () => deletePane(pane));
    host.append(head);

    const group = document.createElement('div');
    group.className = 'group';
    group.innerHTML = `<div class="group__title"></div><div class="group__rows"></div>`;
    group.querySelector('.group__title').textContent = pane.title;
    const rowsHost = group.querySelector('.group__rows');

    if (!pane.items.length) {
        const hint = document.createElement('div');
        hint.className = 'empty-hint';
        hint.textContent = '这个面板还没有设置项，点下面的「添加设置项」。';
        rowsHost.append(hint);
    }

    pane.items.forEach((item, index) => {
        rowsHost.append(buildRow(pane, item, index));
    });

    const add = document.createElement('button');
    add.type = 'button';
    add.className = 'add-row';
    add.innerHTML = `${icon('plus')}<span>添加设置项</span>`;
    add.addEventListener('click', () => addItem(pane));
    rowsHost.append(add);

    host.append(group);
}

function buildRow(pane, item, index) {
    const row = document.createElement('div');
    row.className = 'item';
    row.dataset.itemId = item.id;
    row.setAttribute('role', 'button');
    row.tabIndex = 0;
    row.draggable = true;
    row.setAttribute('aria-selected', String(item.id === selection?.itemId));

    let controlHtml = '';
    if (item.type === 'switch') controlHtml = '<span class="preview-switch"></span>';
    else if (item.type === 'slider') controlHtml = '<span class="preview-slider"></span>';
    else if (item.type === 'select') controlHtml = '<span class="preview-chip">自动</span>';
    else controlHtml = icon('chevron');

    row.innerHTML = `
        <span class="item__handle" title="拖动排序" aria-hidden="true">${icon('drag')}</span>
        <span class="item__icon">${icon(pane.icon)}</span>
        <span class="item__main">
            <div class="item__title"></div>
            <div class="item__desc"></div>
        </span>
        <span class="item__control">${controlHtml}</span>`;
    row.querySelector('.item__title').textContent = item.title || '未命名设置项';
    const desc = row.querySelector('.item__desc');
    desc.textContent = item.desc || '暂无描述，可在右侧补充';
    desc.classList.toggle('is-empty', !item.desc);

    row.addEventListener('click', () => {
        selection = { paneId: pane.id, itemId: item.id };
        render();
    });
    row.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            selection = { paneId: pane.id, itemId: item.id };
            render();
        }
    });

    // ---- 拖拽排序 ----
    row.addEventListener('dragstart', (event) => {
        dragContext = { paneId: pane.id, itemId: item.id };
        row.classList.add('dragging');
        event.dataTransfer.effectAllowed = 'move';
        try { event.dataTransfer.setData('text/plain', item.id); } catch { /* 部分浏览器限制 */ }
    });
    row.addEventListener('dragend', () => {
        dragContext = null;
        row.classList.remove('dragging');
        clearDropMarks();
    });
    row.addEventListener('dragover', (event) => {
        if (!dragContext || dragContext.paneId !== pane.id || dragContext.itemId === item.id) return;
        event.preventDefault();
        const rect = row.getBoundingClientRect();
        const after = event.clientY > rect.top + rect.height / 2;
        clearDropMarks();
        row.classList.add(after ? 'drop-after' : 'drop-before');
    });
    row.addEventListener('dragleave', () => {
        row.classList.remove('drop-before', 'drop-after');
    });
    row.addEventListener('drop', (event) => {
        if (!dragContext || dragContext.paneId !== pane.id) return;
        event.preventDefault();
        const after = row.classList.contains('drop-after');
        const from = pane.items.findIndex((it) => it.id === dragContext.itemId);
        if (from < 0) return;
        const targetId = item.id;
        snapshot();
        const [moved] = pane.items.splice(from, 1);
        let to = pane.items.findIndex((it) => it.id === targetId);
        if (after) to += 1;
        pane.items.splice(to, 0, moved);
        selection = { paneId: pane.id, itemId: moved.id };
        clearDropMarks();
        save();
        render();
        toast(`已移动到第 ${to + 1} 位`);
    });

    row.style.animation = `none`;
    row.dataset.index = String(index);
    return row;
}

function clearDropMarks() {
    document.querySelectorAll('.item.drop-before, .item.drop-after')
        .forEach((el) => el.classList.remove('drop-before', 'drop-after'));
}

function renderInspector() {
    const host = $('#inspector-body');
    host.textContent = '';
    const pane = currentPane();
    const item = currentItem();

    if (!pane) {
        host.innerHTML = `<div class="inspector__empty">先新建一个面板，再编辑里面的设置项。</div>`;
        return;
    }

    if (!item) {
        host.innerHTML = `<div class="inspector__empty">
            当前面板还没有选中设置项。<br>
            在画布里点一行，或点击「添加设置项」。
        </div>`;
        return;
    }

    const index = pane.items.findIndex((it) => it.id === item.id);

    // 标题
    const titleField = field('标题', `<input class="input" id="f-title" maxlength="60" value="">`);
    titleField.querySelector('#f-title').value = item.title;
    titleField.querySelector('#f-title').addEventListener('input', (event) => {
        item.title = event.target.value;
        save();
        renderPaneList();
        renderCanvas();
    });

    // 描述
    const descField = field('描述', `<textarea class="textarea" id="f-desc" maxlength="240" placeholder="一句话说明这个设置项的作用"></textarea>
        <p class="field__hint">描述会显示在标题下面；留空时界面会给出占位提醒。</p>`);
    descField.querySelector('#f-desc').value = item.desc || '';
    descField.querySelector('#f-desc').addEventListener('input', (event) => {
        item.desc = event.target.value;
        save();
        renderCanvas();
    });

    // 类型
    const seg = document.createElement('div');
    seg.className = 'segmented';
    Object.entries(TYPE_LABEL).forEach(([type, label]) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = label;
        btn.setAttribute('aria-pressed', String(item.type === type));
        btn.addEventListener('click', () => {
            snapshot();
            item.type = type;
            save();
            render();
            toast(`已改为「${label}」`);
        });
        seg.append(btn);
    });
    const typeField = field('控件类型', seg);

    // 所属面板
    const paneSelect = document.createElement('select');
    paneSelect.className = 'select';
    state.panes.forEach((p) => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = p.title;
        if (p.id === pane.id) opt.selected = true;
        paneSelect.append(opt);
    });
    paneSelect.addEventListener('change', () => {
        const target = state.panes.find((p) => p.id === paneSelect.value);
        if (!target || target.id === pane.id) return;
        snapshot();
        const from = pane.items.findIndex((it) => it.id === item.id);
        if (from >= 0) pane.items.splice(from, 1);
        target.items.push(item);
        selection = { paneId: target.id, itemId: item.id };
        save();
        render();
        toast(`已移动到「${target.title}」`);
    });
    const paneField = field('所属面板', paneSelect);

    // 操作
    const actions = document.createElement('div');
    actions.className = 'inspector__actions';

    const upBtn = document.createElement('button');
    upBtn.type = 'button';
    upBtn.className = 'btn btn--outlined';
    upBtn.innerHTML = `${icon('up')}<span>上移</span>`;
    upBtn.disabled = index <= 0;
    upBtn.addEventListener('click', () => moveItem(pane, item, -1));

    const downBtn = document.createElement('button');
    downBtn.type = 'button';
    downBtn.className = 'btn btn--outlined';
    downBtn.innerHTML = `${icon('down')}<span>下移</span>`;
    downBtn.disabled = index >= pane.items.length - 1;
    downBtn.addEventListener('click', () => moveItem(pane, item, 1));

    const delBtn = document.createElement('button');
    delBtn.type = 'button';
    delBtn.className = 'btn btn--danger';
    delBtn.innerHTML = `${icon('trash')}<span>删除</span>`;
    delBtn.addEventListener('click', () => deleteItem(pane, item));

    actions.append(upBtn, downBtn, delBtn);

    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = `标识：${item.id} · 面板标识：${pane.id} · 第 ${index + 1} / ${pane.items.length} 项`;

    host.append(titleField, descField, typeField, paneField, actions, meta);
}

function field(labelText, content) {
    const wrap = document.createElement('div');
    wrap.className = 'field';
    wrap.innerHTML = `<label class="field__label"></label>`;
    wrap.querySelector('.field__label').textContent = labelText;
    if (content instanceof Node) {
        wrap.append(content);
        return wrap;
    }
    const holder = document.createElement('div');
    holder.innerHTML = content;
    while (holder.firstChild) wrap.append(holder.firstChild);
    return wrap;
}

/* =====================================================================
 * 5. 数据操作
 * ===================================================================== */
function uid(prefix) {
    return `${prefix}-${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`;
}

function addItem(pane) {
    snapshot();
    const item = { id: uid('item'), type: 'switch', title: '新设置项', desc: '' };
    pane.items.push(item);
    selection = { paneId: pane.id, itemId: item.id };
    save();
    render();
    toast('已添加设置项，右侧可以直接改名和写描述');
}

function deleteItem(pane, item) {
    snapshot();
    const index = pane.items.findIndex((it) => it.id === item.id);
    if (index < 0) return;
    pane.items.splice(index, 1);
    selection = { paneId: pane.id, itemId: pane.items[Math.min(index, pane.items.length - 1)]?.id || null };
    save();
    render();
    toast('提醒：已删除该项，按 Ctrl+Z 可以恢复', { action: '撤销', onAction: undo });
}

function moveItem(pane, item, delta) {
    const index = pane.items.findIndex((it) => it.id === item.id);
    const to = index + delta;
    if (to < 0 || to >= pane.items.length) return;
    snapshot();
    pane.items.splice(index, 1);
    pane.items.splice(to, 0, item);
    save();
    render();
}

function addPane() {
    const title = prompt('新面板名称', '新面板');
    if (title === null) return;
    const name = title.trim() || '新面板';
    snapshot();
    const pane = { id: uid('pane'), title: name, icon: 'apps', items: [] };
    state.panes.push(pane);
    selection = { paneId: pane.id, itemId: null };
    save();
    render();
    toast(`已新建面板「${name}」`);
}

function renamePane(pane) {
    const title = prompt('面板名称', pane.title);
    if (title === null) return;
    const name = title.trim();
    if (!name) return toast('提醒：名称不能为空');
    snapshot();
    pane.title = name;
    save();
    render();
}

function deletePane(pane) {
    if (state.panes.length <= 1) return toast('提醒：至少保留一个面板');
    snapshot();
    state.panes = state.panes.filter((p) => p.id !== pane.id);
    selection = { paneId: state.panes[0].id, itemId: state.panes[0].items[0]?.id || null };
    save();
    render();
    toast(`提醒：已删除面板「${pane.title}」，按 Ctrl+Z 可以恢复`, { action: '撤销', onAction: undo });
}

/* =====================================================================
 * 6. 导入 / 导出
 * ===================================================================== */
function openExport() {
    $('#export-text').value = JSON.stringify(state, null, 2);
    $('#dlg-export').showModal();
}

function openImport() {
    $('#import-text').value = '';
    $('#dlg-import').showModal();
}

function doImport() {
    const text = $('#import-text').value.trim();
    if (!text) return toast('提醒：先粘贴内容或选择一个 JSON 文件');
    let parsed;
    try {
        parsed = JSON.parse(text);
    } catch (error) {
        return toast('提醒：JSON 解析失败，请检查格式');
    }
    const panes = Array.isArray(parsed) ? parsed : parsed?.panes;
    if (!Array.isArray(panes) || !panes.length) return toast('提醒：数据里没有找到 panes 数组');
    snapshot();
    state = {
        version: 1,
        panes: panes.map((pane) => ({
            id: String(pane.id || uid('pane')),
            title: String(pane.title || '未命名面板'),
            icon: ICONS[pane.icon] ? pane.icon : 'apps',
            items: (Array.isArray(pane.items) ? pane.items : []).map((item) => ({
                id: String(item.id || uid('item')),
                type: TYPE_LABEL[item.type] ? item.type : 'link',
                title: String(item.title || '未命名设置项'),
                desc: String(item.desc || ''),
            })),
        })),
    };
    selection = { paneId: state.panes[0].id, itemId: state.panes[0].items[0]?.id || null };
    save();
    render();
    $('#dlg-import').close();
    toast('导入完成');
}

function download() {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'settings-layout.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

async function copyExport() {
    const text = $('#export-text').value;
    try {
        await navigator.clipboard.writeText(text);
        toast('已复制到剪贴板');
    } catch {
        const area = $('#export-text');
        area.select();
        document.execCommand('copy');
        toast('已复制到剪贴板');
    }
}

/* =====================================================================
 * 7. Toast（措辞统一用「提醒」，不阻断操作）
 * ===================================================================== */
function toast(message, options = {}) {
    const host = $('#toast-host');
    const node = document.createElement('div');
    node.className = 'toast';
    node.innerHTML = `${icon(options.action ? 'warn' : 'check')}<span class="toast__text"></span>`;
    node.querySelector('.toast__text').textContent = message;
    if (options.action) {
        const action = document.createElement('button');
        action.type = 'button';
        action.className = 'toast__action';
        action.textContent = options.action;
        action.addEventListener('click', () => {
            node.remove();
            options.onAction?.();
        });
        node.append(action);
    }
    host.append(node);
    setTimeout(() => {
        node.style.transition = 'opacity .25s ease, transform .25s ease';
        node.style.opacity = '0';
        node.style.transform = 'translateY(8px)';
        setTimeout(() => node.remove(), 260);
    }, options.action ? 6000 : 2600);
}

/* =====================================================================
 * 8. 主题与事件绑定
 * ===================================================================== */
function applyTheme(theme) {
    document.documentElement.dataset.theme = theme;
    try { localStorage.setItem(THEME_KEY, theme); } catch { /* 忽略 */ }
}

function initTheme() {
    let saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch { /* 忽略 */ }
    if (saved === 'dark' || saved === 'light') return applyTheme(saved);
    applyTheme(matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
}

function bindEvents() {
    $('#btn-export').addEventListener('click', openExport);
    $('#btn-import').addEventListener('click', openImport);
    $('#btn-add-pane').addEventListener('click', addPane);
    $('#btn-theme').addEventListener('click', () => {
        applyTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
    });
    $('#btn-reset').addEventListener('click', () => {
        snapshot();
        state = clone(SAMPLE);
        selection = { paneId: state.panes[0].id, itemId: state.panes[0].items[0].id };
        save();
        render();
        toast('已恢复示例数据，Ctrl+Z 可撤销');
    });

    $('#btn-do-import').addEventListener('click', doImport);
    $('#btn-pick-file').addEventListener('click', () => $('#import-file').click());
    $('#import-file').addEventListener('change', async (event) => {
        const file = event.target.files?.[0];
        if (!file) return;
        $('#import-text').value = await file.text();
        event.target.value = '';
    });
    $('#btn-copy').addEventListener('click', copyExport);
    $('#btn-download').addEventListener('click', download);

    document.querySelectorAll('[data-close]').forEach((btn) => {
        btn.addEventListener('click', () => btn.closest('dialog')?.close());
    });

    // 键盘：撤销 / 重做 / 上下移动 / Esc 收起属性面板
    document.addEventListener('keydown', (event) => {
        const editing = /^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName);
        const mod = event.ctrlKey || event.metaKey;
        if (mod && event.key.toLowerCase() === 'z' && !event.shiftKey) {
            if (editing) return;
            event.preventDefault();
            undo();
        } else if (mod && (event.key.toLowerCase() === 'y' || (event.key.toLowerCase() === 'z' && event.shiftKey))) {
            if (editing) return;
            event.preventDefault();
            redo();
        } else if (mod && event.key.toLowerCase() === 's') {
            event.preventDefault();
            save();
            toast('草稿已保存到本机');
        } else if (event.altKey && (event.key === 'ArrowUp' || event.key === 'ArrowDown')) {
            if (editing) return;
            const pane = currentPane();
            const item = currentItem();
            if (!pane || !item) return;
            event.preventDefault();
            moveItem(pane, item, event.key === 'ArrowUp' ? -1 : 1);
        } else if (event.key === 'Escape') {
            $('#inspector').classList.remove('is-open');
        }
    });

    // 窄屏：选中设置项后把属性面板升起
    $('#canvas').addEventListener('click', () => {
        if (matchMedia('(max-width: 1120px)').matches) {
            $('#inspector').classList.add('is-open');
        }
    });
}

/* =====================================================================
 * 9. 启动
 * ===================================================================== */
initTheme();
bindEvents();
if (!state.panes.length) state = clone(SAMPLE);
selection = { paneId: state.panes[0].id, itemId: state.panes[0].items[0]?.id || null };
render();
save();
</script>
