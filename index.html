<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deskly</title>
    <!-- 品牌图标：SVG 优先，ICO 兜底含 16/32/48，PNG 供不支持 ICO 的宿主；尺寸条目与 assets/brand 实际像素一一对应 -->
    <link rel="icon" type="image/svg+xml" href="./assets/brand/deskly-logo.svg" />
    <link rel="icon" type="image/x-icon" href="./assets/brand/deskly-favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/brand/deskly-favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/brand/deskly-favicon-32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="./assets/brand/deskly-favicon-48.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./assets/brand/deskly-logo-192.png" />

    <!-- 首帧壁纸：必须是同步经典脚本，且排在所有样式表之前。
         模块脚本是 deferred，等它执行时默认壁纸已经画上屏；MV3 CSP 又禁止内联脚本。
         该文件只读 localStorage 的壁纸配置并写一个 CSS 变量，见文件头说明。 -->
    <script src="./src/javascripts/wallpaper-boot.js"></script>

    <!-- 程序坞默认收藏图标预加载：dock.js 求值时就能命中真实 PNG，
         首帧不出现通用占位图；与 manifest.icon 指向同一张位图，不引入新资源。
         这里只列「必然被渲染」的五个应用图标：下载条目允许用户从程序坞移除，
         移除后启动期没有任何 <img> 会消费它（它的下载栈图标只在展开时才创建），
         预加载就成了永不消费的资源并触发「preloaded but not used」告警；
         需要时由 dock 自己的 <img> 请求同一 URL，缓存照样命中。 -->
    <link rel="preload" as="image" href="./mods/finder/Finder.png" fetchpriority="high" />
    <link rel="preload" as="image" href="./mods/launchpad/Launchpad.png" fetchpriority="high" />
    <link rel="preload" as="image" href="./mods/safari/Safari.png" fetchpriority="high" />
    <link rel="preload" as="image" href="./mods/system-settings/Reglages systeme.png" fetchpriority="high" />
    <link rel="preload" as="image" href="./mods/app-store/App Store.png" fetchpriority="high" />

    <link rel="stylesheet" href="./assets/stylesheets/main/main.css?v=0.4.3" />
    <link rel="stylesheet" href="./assets/stylesheets/finderbar/finderbar.css?v=0.4.3" />
    <link rel="stylesheet" href="./assets/stylesheets/dock/dock.css?v=0.4.3" />
    <link rel="stylesheet" href="./assets/stylesheets/main/desktop.css?v=0.4.3" />
    <link rel="stylesheet" href="./assets/stylesheets/main/desktop-view.css?v=0.4.3" />
    <link rel="stylesheet" href="./assets/stylesheets/main/quicklook.css?v=0.4.3" />
    <link rel="stylesheet" href="./assets/stylesheets/main/getinfo.css?v=0.4.3" />
    <link rel="stylesheet" href="./assets/stylesheets/main/openwith.css?v=0.4.3" />
    <link rel="stylesheet" href="./assets/stylesheets/cursor/cursor.css?v=0.4.3" />
    <link rel="stylesheet" href="./assets/stylesheets/ui/ui.css?v=0.4.3">
    <link rel="stylesheet" href="./assets/stylesheets/ui/contextMenu.css?v=0.4.3">
    <link rel="stylesheet" href="./assets/stylesheets/ui/window.css?v=0.4.3">
    <link rel="stylesheet" href="./assets/stylesheets/ui/windowframe.css?v=0.4.3">
    <link rel="stylesheet" href="./assets/stylesheets/ui/spaces.css?v=0.4.3">
    <link rel="stylesheet" href="./assets/stylesheets/ui/trafficlights.css?v=0.4.3">
    <link rel="stylesheet" href="./assets/stylesheets/ui/windowtraffic.css?v=0.4.3">
    <link rel="stylesheet" href="./assets/stylesheets/ui/datetime-popover.css?v=0.4.3">
    <link rel="stylesheet" href="./assets/stylesheets/ui/controlcenter.css?v=0.4.3">
    <link rel="stylesheet" href="./assets/stylesheets/ui/alert.css?v=0.4.3">
    <link rel="stylesheet" href="./assets/stylesheets/ui/popover.css?v=0.4.3">
</head>

<body class="cursor-default">
    <div class="wallpaper"></div>
    <header class="finderbar" id="finderbar"></header>

    <div class="desktop" id="desktop">
        <div class="container"></div>
    </div>
    <!-- Dock 悬停提示：文本由 dock.js 按当前悬停项写入，这里只给出语言回退 -->
    <div class="tip" id="tip" data-i18n="dock.finder" data-i18n-fallback="访达">访达</div>
    <div class="dockcontainer">
        <footer class="dock" id="dock"></footer>
    </div>

    <!-- Menus：MV3 CSP 禁止内联事件处理器，命令统一由 bootstrap.js 绑定、
         ui/menuCommands.js 按注册表分发（cmd 即注册表键名，可带一个字符串实参）。 -->
    <div class="menu" menu="logo" nomatchapp="yes">
        <p cmd="openAppByName('关于本机')" data-i18n="menu.about" data-i18n-fallback="关于本机">
            关于本机</p>
        <hr />
        <p cmd="openAppByName('系统设置')" data-i18n="menu.systemPreferences" data-i18n-fallback="系统设置...">
            系统设置...</p>
        <p cmd="openAppByName('App Store')" data-i18n="menu.appStore" data-i18n-fallback="App Store...">
            App Store...</p>
        <hr />
        <p data-action="recent-items" data-i18n="menu.recentItems" data-i18n-fallback="最近使用的项目">最近使用的项目</p>
        <hr />
        <p cmd="forceQuit" data-i18n="menu.forceQuit" data-i18n-fallback="强制退出...">强制退出...</p>
        <hr />
        <p cmd="sleep" data-i18n="menu.sleep" data-i18n-fallback="睡眠">睡眠</p>
        <p cmd="restart" data-i18n="menu.restart" data-i18n-fallback="重新启动...">重新启动...</p>
        <p cmd="shutdown" data-i18n="menu.shutdown" data-i18n-fallback="关机...">关机...</p>
        <hr />
        <p cmd="lockScreen" data-i18n="menu.lockScreen" data-i18n-fallback="锁定屏幕">锁定屏幕</p>
        <p cmd="logOut" data-i18n="menu.logOut" data-i18n-fallback="退出登录...">退出登录...</p>
    </div>
    <div class="menu" menu="appname" nomatchapp="yes">
        <p cmd="aboutActiveApp" data-i18n="menu.app.about" data-i18n-fallback="关于访达">关于访达</p>
        <hr />
        <p cmd="openAppByName('系统设置')" data-i18n="menu.app.settings" data-i18n-fallback="设置...">设置...</p>
        <hr />
        <p cmd="emptyTrash" data-i18n="menu.app.emptyTrash" data-i18n-fallback="清倒废纸篓">清倒废纸篓</p>
        <hr />
        <p cmd="hideActiveApp" data-i18n="menu.app.hide" data-i18n-fallback="隐藏访达">隐藏访达</p>
        <p cmd="hideOthers" data-i18n="menu.app.hideOthers" data-i18n-fallback="隐藏其他">隐藏其他</p>
        <p cmd="showAll" data-i18n="menu.app.showAll" data-i18n-fallback="全部显示">全部显示</p>
    </div>

    <script type="module" src="./src/javascripts/main.js"></script>
    <script type="module" src="./src/javascripts/plugin-manager.js"></script>
    <script type="module" src="./src/javascripts/finderbar.js"></script>
    <script type="module" src="./src/javascripts/dock.js"></script>
    <script type="module" src="./src/javascripts/desktop.js"></script>
    <script type="module" src="./src/javascripts/window.js"></script>
    <script type="module" src="./src/javascripts/ui/alert.js"></script>
    <script type="module" src="./src/javascripts/ui/popover.js"></script>
    <script type="module" src="./src/javascripts/ui/menu.js"></script>
    <script type="module" src="./src/javascripts/client.js"></script>
    <script type="module" src="./assets/vendor/webswift.js"></script>
    <script type="module" src="./src/javascripts/bootstrap.js"></script>
</body>

</html>
